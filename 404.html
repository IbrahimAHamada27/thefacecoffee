<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>404 - الصفحة غير موجودة | THE FACE Cafe</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/img/Screenshot 2026-07-16 190451.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script>
    // GitHub Pages SPA Redirect Logic for Refresh on Subpaths (like /home)
    (function() {
      var path = window.location.pathname;
      // If refreshed on subpaths like /home, redirect seamlessly to home page /
      if (path && path !== '/' && path !== '/index.html' && path !== '/404.html') {
        window.location.replace(window.location.origin + '/');
      }
    })();
  </script>

  <style>
    :root {
      --bg-dark: #0A0A0F;
      --card-bg: rgba(22, 22, 32, 0.75);
      --accent-gold: #C5A059;
      --accent-gold-light: #E5C178;
      --text-main: #FFFFFF;
      --text-muted: #A0A0B0;
      --border-glow: rgba(197, 160, 89, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Tajawal', 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Glow Effects */
    .bg-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite alternate;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }

    /* Card Container */
    .container {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 90%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(197, 160, 89, 0.1);
      animation: fadeInUp 0.8s ease-out forwards;
    }

    /* Logo Styling */
    .logo-wrapper {
      margin: 0 auto 20px;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent-gold), rgba(197, 160, 89, 0.2));
      box-shadow: 0 0 25px rgba(197, 160, 89, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .logo-wrapper:hover {
      transform: scale(1.05) rotate(5deg);
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* 404 Text */
    .errorCode {
      font-family: 'Outfit', sans-serif;
      font-size: 84px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #FFFFFF 30%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #FFFFFF;
    }

    p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Home Button */
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--accent-gold) 0%, #A37F38 100%);
      color: #0A0A0F;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.35);
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: linear-gradient(135deg, var(--accent-gold-light) 0%, var(--accent-gold) 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(197, 160, 89, 0.5);
    }

    .btn-home svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Animations */
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="container">
    <div class="logo-wrapper">
      <img src="assets/img/Screenshot 2026-07-16 190451.png" alt="THE FACE Cafe Logo">
    </div>

    <div class="errorCode">404</div>
    <h1>عذراً! الصفحة غير موجودة</h1>
    <p>يبدو أن الصفحة التي تحاول الوصول إليها تم نقلها أو غير موجودة. اضغط على الزر بالأسفل للعودة إلى الصفحة الرئيسية واستكشاف منيو القهوة المميزة.</p>

    <a href="/" class="btn-home">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      العودة للصفحة الرئيسية
    </a>
  </div>
</body>
</html>
