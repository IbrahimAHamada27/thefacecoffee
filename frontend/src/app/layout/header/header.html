<header [class.scrolled]="isScrolled" [class.glass-panel]="isScrolled">
  <div class="container header-container">
    <div class="logo">
      <a href="#" (click)="closeMobileMenu()">
        <img src="assets/img/Screenshot 2026-07-16 190451.png" alt="THE FACE Logo" height="50">
      </a>
    </div>

    <!-- Desktop & Laptop Navigation -->
    <nav class="desktop-nav">
      <div class="nav-desktop">
        <a href="javascript:void(0)" title="About" class="nav-item" (click)="scrollTo('about')">
          <i class="fa-solid fa-user nav-icon"></i>
          <span class="nav-text">About</span>
        </a>
        <a href="javascript:void(0)" title="Story" class="nav-item" (click)="scrollTo('story')">
          <i class="fa-solid fa-book-open nav-icon"></i>
          <span class="nav-text">Story</span>
        </a>
        <a href="javascript:void(0)" title="Menu" class="nav-item" (click)="scrollTo('menu')">
          <i class="fa-solid fa-mug-hot nav-icon"></i>
          <span class="nav-text">Menu</span>
        </a>
        <a href="javascript:void(0)" title="Gallery" class="nav-item" (click)="scrollTo('gallery')">
          <i class="fa-solid fa-images nav-icon"></i>
          <span class="nav-text">Gallery</span>
        </a>
        <a href="javascript:void(0)" title="Contact" class="nav-item" (click)="scrollTo('contact')">
          <i class="fa-solid fa-paper-plane nav-icon"></i>
          <span class="nav-text">Contact</span>
        </a>
      </div>
    </nav>
    
    <button class="btn-primary pulse-glow desktop-cta" (click)="scrollTo('menu')">Order Now</button>

    <!-- Mobile Hamburger Toggle -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Navigation">
      <span class="hamburger-bar" [class.active]="isMobileMenuOpen"></span>
      <span class="hamburger-bar" [class.active]="isMobileMenuOpen"></span>
      <span class="hamburger-bar" [class.active]="isMobileMenuOpen"></span>
    </button>
  </div>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-overlay" [class.open]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
  <div class="mobile-drawer" [class.open]="isMobileMenuOpen">
    <div class="drawer-header">
      <img src="assets/img/Screenshot 2026-07-16 190451.png" alt="THE FACE Logo" height="40">
      <button class="close-btn" (click)="closeMobileMenu()">&times;</button>
    </div>
    <ul class="mobile-links">
      <li><a (click)="scrollTo('story')">Our Story</a></li>
      <li><a (click)="scrollTo('about')">Brand Experience</a></li>
      <li><a (click)="scrollTo('journey')">Customer Journey</a></li>
      <li><a (click)="scrollTo('menu')">Menu</a></li>
      <li><a (click)="scrollTo('gallery')">Gallery</a></li>
      <li><a (click)="scrollTo('contact')">Contact</a></li>
    </ul>
    <button class="btn-primary pulse-glow w-100 mt-20" (click)="scrollTo('menu')">Order Now</button>
  </div>
</header>
